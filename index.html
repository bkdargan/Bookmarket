<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Bookmark Board</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card-bg: #ffffff;
      --border: #d0d4dc;
      --accent: #2c7be5;
      --text-main: #222;
      --text-muted: #666;
      --topbar-bg: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,0.12);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-main);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title {
      font-weight: 600;
      font-size: 18px;
    }

    .topbar-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 13px;
      min-width: 220px;
    }

    .csv-input {
      font-size: 12px;
    }

    .board {
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    .group-column {
      min-width: 260px;
      max-width: 280px;
      background: var(--card-bg);
      border-radius: 6px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .group-column.drag-over {
      outline: 2px dashed var(--accent);
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .group-title {
      font-weight: 600;
      font-size: 14px;
    }

    .group-count {
      font-size: 11px;
      color: var(--text-muted);
    }

    .link-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .link-item {
      margin-bottom: 6px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .link-icon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      flex-shrink: 0;
    }

    .link-content {
      display: flex;
      flex-direction: column;
    }

    .link-item a {
      text-decoration: none;
      font-size: 13px;
      color: var(--accent);
    }

    .link-item a:hover {
      text-decoration: underline;
    }

    .link-note {
      font-size: 11px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .board {
        padding: 8px;
      }
      .group-column {
        min-width: 220px;
      }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal {
      background: #fff;
      border-radius: 6px;
      padding: 16px;
      width: 320px;
      box-shadow: var(--shadow);
    }

    .modal h2 {
      margin-top: 0;
      font-size: 16px;
    }

    .modal label {
      font-size: 13px;
      display: block;
      margin-bottom: 8px;
    }

    .modal input {
      width: 100%;
      margin-top: 4px;
      padding: 4px 6px;
      font-size: 13px;
    }

    .modal-actions {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="app-title">My Bookmark Board</div>
      <div class="topbar-buttons">
        <button class="btn btn-primary" id="btnAddGroup">Add Group</button>
        <button class="btn" id="btnEditView">Edit View</button>
        <button class="btn" id="btnActions">Actions</button>
        <label class="csv-input">
          Import CSV
          <input type="file" id="csvFile" accept=".csv" />
        </label>
      </div>
    </div>
    <div class="topbar-right">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Search bookmarks..."
      />
    </div>
  </header>

  <main class="board" id="board"></main>

  <!-- Modal: Add group -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2>Add Group</h2>
      <label>
        Group name
        <input type="text" id="newGroupName" />
      </label>
      <div class="modal-actions">
        <button class="btn" id="btnCancelModal">Cancel</button>
        <button class="btn btn-primary" id="btnSaveGroup">Save</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add link -->
  <div class="modal-backdrop" id="linkModalBackdrop">
    <div class="modal">
      <h2>Add Link</h2>
      <label>
        Label
        <input type="text" id="linkLabel" />
      </label>
      <label>
        URL
        <input type="text" id="linkUrl" />
      </label>
      <label>
        Note (optional)
        <input type="text" id="linkNote" />
      </label>
      <label>
        Color (optional)
        <input type="text" id="linkColor" placeholder="#2c7be5" />
      </label>
      <label>
        Icon text fallback (optional)
        <input type="text" id="linkIconText" placeholder="M" />
      </label>
      <div class="modal-actions">
        <button class="btn" id="btnCancelLinkModal">Cancel</button>
        <button class="btn btn-primary" id="btnSaveLink">Save</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "bookmarkBoardGroups";

    const defaultData = [
      {
        title: "Property Research Step 1",
        links: [
          { label: "TMLS Dashboard", url: "https://example.com/tmls", note: "MLS access", color: "#2c7be5", iconText: "T" },
          { label: "GIS / County Maps", url: "https://example.com/gis", note: "Parcel boundaries", color: "#28a745", iconText: "G" }
        ]
      },
      {
        title: "Marketing",
        links: [
          { label: "YouTube Subtitle Downloader", url: "https://example.com/youtube-subtitles", note: "Pull captions", color: "#ff9800", iconText: "Y" },
          { label: "Canva", url: "https://example.com/canva", note: "Design templates", color: "#673ab7", iconText: "C" }
        ]
      }
    ];

    function loadGroups() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData;
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
        return defaultData;
      } catch {
        return defaultData;
      }
    }

    function saveGroups() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(groups));
    }

    let groups = loadGroups();
    let dragSourceIndex = null;
    let activeGroupForNewLink = null;

    const boardEl = document.getElementById("board");
    const searchInput = document.getElementById("searchInput");

    function getFavicon(url) {
      try {
        const u = new URL(url);
        return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=32`;
      } catch {
        return "";
      }
    }

    function renderBoard(filterText = "") {
      boardEl.innerHTML = "";
      const normalizedFilter = filterText.trim().toLowerCase();

      groups.forEach((group, index) => {
        const filteredLinks = group.links.filter(link => {
          if (!normalizedFilter) return true;
          return (
            link.label.toLowerCase().includes(normalizedFilter) ||
            link.url.toLowerCase().includes(normalizedFilter) ||
            (link.note || "").toLowerCase().includes(normalizedFilter)
          );
        });

        if (!filteredLinks.length && normalizedFilter) return;

        const col = document.createElement("section");
        col.className = "group-column";
        col.setAttribute("draggable", "true");
        col.dataset.index = index;

        col.addEventListener("dragstart", handleDragStart);
        col.addEventListener("dragover", handleDragOver);
        col.addEventListener("dragleave", handleDragLeave);
        col.addEventListener("drop", handleDrop);
        col.addEventListener("dragend", handleDragEnd);

        const header = document.createElement("div");
        header.className = "group-header";

        const title = document.createElement("div");
        title.className = "group-title";
        title.textContent = group.title;

        const count = document.createElement("div");
        count.className = "group-count";
        count.textContent = `${filteredLinks.length} link${filteredLinks.length !== 1 ? "s" : ""}`;

        header.appendChild(title);
        header.appendChild(count);

        const list = document.createElement("ul");
        list.className = "link-list";

        filteredLinks.forEach((link, linkIndex) => {
          const li = document.createElement("li");
          li.className = "link-item";

          if (link.color) {
            li.style.borderLeft = `3px solid ${link.color}`;
            li.style.paddingLeft = "4px";
          }

          const iconImg = document.createElement("img");
          iconImg.className = "link-icon";
          iconImg.src = getFavicon(link.url);
          iconImg.alt = "";
          iconImg.style.width = "16px";
          iconImg.style.height = "16px";
          iconImg.style.borderRadius = "3px";

          iconImg.onerror = () => {
            iconImg.remove();
            const fallback = document.createElement("div");
            fallback.className = "link-icon";
            fallback.textContent = (link.iconText || link.label[0] || "?").toUpperCase();
            fallback.style.background = link.color || "#999";
            li.prepend(fallback);
          };

          li.prepend(iconImg);

          const content = document.createElement("div");
          content.className = "link-content";

          const a = document.createElement("a");
          a.href = link.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = link.label;

          content.appendChild(a);

          if (link.note) {
            const note = document.createElement("div");
            note.className = "link-note";
            note.textContent = link.note;
            content.appendChild(note);
          }

          li.appendChild(content);
          list.appendChild(li);
        });

        const addLinkBtn = document.createElement("button");
        addLinkBtn.className = "btn";
        addLinkBtn.textContent = "+ Link";
        addLinkBtn.style.marginTop = "6px";
        addLinkBtn.addEventListener("click", () => openLinkModal(index));

        col.appendChild(header);
        col.appendChild(list);
        col.appendChild(addLinkBtn);
        boardEl.appendChild(col);
      });
    }

    function handleDragStart(e) {
      dragSourceIndex = Number(e.currentTarget.dataset.index);
      e.dataTransfer.effectAllowed = "move";
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      e.currentTarget.classList.add("drag-over");
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove("drag-over");
    }

    function handleDrop(e) {
      e.preventDefault();
      const targetIndex = Number(e.currentTarget.dataset.index);
      e.currentTarget.classList.remove("drag-over");
      if (dragSourceIndex === null || dragSourceIndex === targetIndex) return;

      const [moved] = groups.splice(dragSourceIndex, 1);
      groups.splice(targetIndex, 0, moved);
      dragSourceIndex = null;
      saveGroups();
      renderBoard(searchInput.value);
    }

    function handleDragEnd(e) {
      e.currentTarget.classList.remove("drag-over");
      dragSourceIndex = null;
    }

    renderBoard();

    searchInput.addEventListener("input", (e) => {
      renderBoard(e.target.value);
    });

    const modalBackdrop = document.getElementById("modalBackdrop");
    const btnAddGroup = document.getElementById("btnAddGroup");
    const btnCancelModal = document.getElementById("btnCancelModal");
    const btnSaveGroup = document.getElementById("btnSaveGroup");
    const newGroupNameInput = document.getElementById("newGroupName");

    function openGroupModal() {
      modalBackdrop.style.display = "flex";
      newGroupNameInput.value = "";
      newGroupNameInput.focus();
    }

    function closeGroupModal() {
      modalBackdrop.style.display = "none";
    }

    btnAddGroup.addEventListener("click", openGroupModal);
    btnCancelModal.addEventListener("click", closeGroupModal);

    btnSaveGroup.addEventListener("click", () => {
      const name = newGroupNameInput.value.trim();
      if (!name) return;
      groups.push({ title: name, links: [] });
      saveGroups();
      renderBoard(searchInput.value);
      closeGroupModal();
    });

    const linkModalBackdrop = document.getElementById("linkModalBackdrop");
    const linkLabelInput = document.getElementById("linkLabel");
    const linkUrlInput = document.getElementById("linkUrl");
    const linkNoteInput = document.getElementById("linkNote");
    const linkColorInput = document.getElementById("linkColor");
    const linkIconTextInput = document.getElementById("linkIconText");
    const btnCancelLinkModal = document.getElementById("btnCancelLinkModal");
    const btnSaveLink = document.getElementById("btnSaveLink");

    function openLinkModal(groupIndex) {
      activeGroupForNewLink = groupIndex;
      linkModalBackdrop.style.display = "flex";
      linkLabelInput.value = "";
      linkUrlInput.value = "";
      linkNoteInput.value = "";
      linkColorInput.value = "";
      linkIconTextInput.value = "";
      linkLabelInput.focus();
    }

    function closeLinkModal() {
      linkModalBackdrop.style.display = "none";
      activeGroupForNewLink = null;
    }

    btnCancelLinkModal.addEventListener("click", closeLinkModal);

    btnSaveLink.addEventListener("click", () => {
      if (activeGroupForNewLink === null) return;
      const label = linkLabelInput.value.trim();
      const url = linkUrlInput.value.trim();
      const note = linkNoteInput.value.trim();
      const color = linkColorInput.value.trim();
      const iconText = linkIconTextInput.value.trim();

      if (!label || !url) return;

      groups[activeGroupForNewLink].links.push({
        label,
        url,
        note: note || "",
        color: color || "",
        iconText: iconText || ""
      });

      saveGroups();
      renderBoard(searchInput.value);
      closeLinkModal();
    });

    document.getElementById("btnEditView").addEventListener("click", () => {
      alert("Future: compact mode, hide notes, etc.");
    });

    document.getElementById("btnActions").addEventListener("click", () => {
      alert("Future: export to CSV, reset layout, etc.");
    });

    const csvFileInput = document.getElementById("csvFile");

    csvFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader
