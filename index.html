<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bryant’s Bookmark Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body {
    font-family: "Segoe UI", Roboto, sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
    color:#222;
  }
  h1 {
    text-align:center;
    font-size:26px;
    margin-bottom:20px;
  }
  #searchBox {
    display:block;
    margin:0 auto 20px auto;
    max-width:500px;
    width:100%;
    padding:10px 14px;
    border-radius:999px;
    border:1px solid #ccc;
    font-size:15px;
  }
  #importArea, #tabsArea, #exportArea {
    text-align:center;
    margin-bottom:20px;
  }
  #importArea input {
    margin:6px;
  }
  .section {
    background:#ffffff;
    border-radius:10px;
    padding:14px 16px;
    margin:10px 0;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  .section-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-weight:600;
    font-size:17px;
  }
  .section-header .arrow {
    transition:transform 0.2s;
    font-size:14px;
  }
  .section.open .arrow {
    transform:rotate(90deg);
  }
  .section-content {
    display:none;
    margin-top:10px;
  }
  .section-content ul {
    list-style:none;
    padding:0;
    margin:0;
  }
  .section-content li {
    margin:6px 0;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-content a {
    text-decoration:none;
    color:#0056b3;
  }
  .section-content a:hover {
    text-decoration:underline;
  }
  .icon {
    margin-right:6px;
    color:#888;
  }
  .btn {
    background:#eaeaea;
    border:none;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    margin:4px;
  }
  .btn:hover {
    background:#dcdcdc;
  }
  #addSectionBtn {
    display:block;
    margin:20px auto;
    padding:10px 16px;
    font-size:14px;
    border-radius:8px;
    border:none;
    background:#0056b3;
    color:white;
    cursor:pointer;
  }
  #addSectionBtn:hover {
    background:#0078d4;
  }
</style>
</head>
<body>

<h1>🌐 Bryant’s Bookmark Manager</h1>

<input id="searchBox" type="text" placeholder="Search links…" onkeyup="filterLinks()">

<div id="importArea">
  <input id="fileInput" type="file" accept="*/*">
  <button class="btn" onclick="importAnyFile()">Import File (HTML / JSON / CSV / TXT)</button>
</div>

<div id="tabsArea">
  <button class="btn" onclick="importOpenTabsAsSection()">Import Open Tabs as New Section</button>
  <button class="btn" onclick="importOpenTabsMerge()">Merge Open Tabs into Existing Section</button>
</div>

<div id="exportArea">
  <button class="btn" onclick="exportOpenTabsCSV()">Export Open Tabs to CSV</button>
  <button class="btn" onclick="exportOpenTabsHTML()">Export Open Tabs to HTML</button>
</div>

<button id="addSectionBtn" onclick="addSection()">➕ Add New Section</button>

<div id="sectionsContainer"></div>

<script>
/* ---------------------------------------------------------
   CLEAN EDGE BROWSER TAB METADATA
   --------------------------------------------------------- */
const edge_all_open_tabs = [
  {
    pageTitle: "Bryant’s Bookmark Manager",
    pageUrl: "",
    tabId: 548149674,
    isCurrent: true
  }
  // add more tabs here if you want
];

/* ---------------------------------------------------------
   DATA LOAD / SAVE
--------------------------------------------------------- */
let data = JSON.parse(localStorage.getItem("bkd_links")) || {
  sections: []
};

function save() {
  localStorage.setItem("bkd_links", JSON.stringify(data));
}

/* ---------------------------------------------------------
   RENDER SECTIONS
--------------------------------------------------------- */
function render() {
  const container = document.getElementById("sectionsContainer");
  container.innerHTML = "";

  data.sections.forEach((section, index) => {
    const div = document.createElement("div");
    div.className = "section";

    div.innerHTML = `
      <div class="section-header" onclick="toggleSection(this)">
        <span>${section.title}</span>
        <span>
          <button class="btn" onclick="event.stopPropagation(); deleteSection(${index})">🗑 Delete</button>
          <span class="arrow">▶</span>
        </span>
      </div>
      <div class="section-content">
        <ul>
          ${section.links.map((link, i) => `
            <li>
              <span><i class="fa-solid fa-link icon"></i>
              <a href="${link.url}" target="_blank">${link.text}</a></span>
              <button class="btn" onclick="deleteLink(${index}, ${i})">Delete</button>
            </li>
          `).join("")}
        </ul>
        <button class="btn" onclick="addLink(${index})">➕ Add Link</button>
      </div>
    `;

    container.appendChild(div);
  });
}

render();

/* ---------------------------------------------------------
   TOGGLE SECTION
--------------------------------------------------------- */
function toggleSection(header) {
  const section = header.parentElement;
  const content = section.querySelector(".section-content");
  const isOpen = section.classList.contains("open");

  document.querySelectorAll(".section-content").forEach(c => c.style.display = "none");
  document.querySelectorAll(".section").forEach(s => s.classList.remove("open"));

  if (!isOpen) {
    content.style.display = "block";
    section.classList.add("open");
  }
}

/* ---------------------------------------------------------
   ADD / DELETE SECTION
--------------------------------------------------------- */
function addSection() {
  const title = prompt("Section name:");
  if (!title) return;

  data.sections.push({ title, links: [] });
  save();
  render();
}

function deleteSection(index) {
  if (!confirm("Delete this entire section?")) return;
  data.sections.splice(index, 1);
  save();
  render();
}

/* ---------------------------------------------------------
   ADD / DELETE LINK
--------------------------------------------------------- */
function addLink(sectionIndex) {
  const text = prompt("Link name:");
  if (!text) return;

  const url = prompt("Link URL:");
  if (!url) return;

  data.sections[sectionIndex].links.push({ text, url });
  save();
  render();
}

function deleteLink(sectionIndex, linkIndex) {
  data.sections[sectionIndex].links.splice(linkIndex, 1);
  save();
  render();
}

/* ---------------------------------------------------------
   SEARCH FILTER
--------------------------------------------------------- */
function filterLinks() {
  const q = document.getElementById("searchBox").value.toLowerCase();
  const sections = document.querySelectorAll(".section");

  sections.forEach(section => {
    const links = section.querySelectorAll("a");
    let match = false;

    links.forEach(a => {
      if (a.textContent.toLowerCase().includes(q)) match = true;
    });

    section.style.display = match || q === "" ? "block" : "none";
  });
}

/* ---------------------------------------------------------
   UNIVERSAL IMPORT ENGINE
   - Netscape HTML (Bookmarkee, Chrome, Firefox, Edge)
   - JSON
   - Proprietary Bookmarkee HTML
   - Plain text (URLs)
   - CSV (URL lists)
--------------------------------------------------------- */
async function importAnyFile() {
  const input = document.getElementById("fileInput");
  const file = input.files && input.files[0];

  if (!file) {
    alert("No file selected.");
    return;
  }

  let text = await file.text();

  // 1. REMOVE Edge-injected WebsiteContent wrappers
  let cleaned = text.replace(/<WebsiteContent_[^>]+>/g, "")
                    .replace(/<\/WebsiteContent_[^>]+>/g, "");

  // 2. REMOVE invisible Unicode characters
  cleaned = cleaned.replace(/[\u0000-\u001F\u007F-\u009F]/g, "");

  // 3. REMOVE escaped unicode sequences like \u0026
  cleaned = cleaned.replace(/\\u[\dA-F]{4}/gi, "");

  // 4. UNIVERSAL PARSER: detect format
  if (cleaned.includes("<H3") && cleaned.includes("<A ")) {
    parseNetscapeHTML(cleaned);
  } else if (cleaned.trim().startsWith("{")) {
    parseJSONBookmarks(cleaned);
  } else if (cleaned.includes("<div") && cleaned.includes("folder")) {
    parseBookmarkeeHTML(cleaned);
  } else if (cleaned.includes(",") && cleaned.split("\n")[0].includes(",")) {
    parseCSVText(cleaned);
  } else {
    parsePlainText(cleaned);
  }

  save();
  render();
  alert("Import complete!");
}

/* ---------------------------------------------------------
   Netscape HTML parser (Bookmarkee, Chrome, Firefox, Edge)
--------------------------------------------------------- */
function parseNetscapeHTML(html) {
  const sectionRegex = /<H3[^>]*>(.*?)<\/H3>/gi;
  const linkRegex = /<A [^>]*HREF="([^"]+)"[^>]*>(.*?)<\/A>/gi;

  let match;
  while ((match = sectionRegex.exec(html)) !== null) {
    const title = match[1].trim();

    // Find the DL block after this H3
    const start = match.index + match[0].length;
    const dlBlock = html.slice(start).match(/<DL[^>]*>([\s\S]*?)<\/DL>/i);

    const links = [];
    if (dlBlock) {
      let linkMatch;
      while ((linkMatch = linkRegex.exec(dlBlock[1])) !== null) {
        links.push({
          text: linkMatch[2].trim(),
          url: linkMatch[1].trim()
        });
      }
    }

    data.sections.push({ title, links });
  }
}

/* ---------------------------------------------------------
   Bookmarkee JSON parser
--------------------------------------------------------- */
function parseJSONBookmarks(jsonText) {
  let obj;
  try {
    obj = JSON.parse(jsonText);
  } catch (e) {
    alert("Invalid JSON file.");
    return;
  }

  if (!obj.folders) return;

  obj.folders.forEach(folder => {
    const links = (folder.links || []).map(l => ({
      text: l.title,
      url: l.url
    }));

    data.sections.push({
      title: folder.name || "Untitled",
      links
    });
  });
}

/* ---------------------------------------------------------
   Proprietary Bookmarkee HTML parser
--------------------------------------------------------- */
function parseBookmarkeeHTML(html) {
  const folderRegex = /<div[^>]*class="folder"[^>]*>([\s\S]*?)<\/div>/gi;
  const titleRegex = /<div[^>]*class="title"[^>]*>(.*?)<\/div>/i;
  const linkRegex = /<a[^>]*href="([^"]+)"[^>]*>(.*?)<\/a>/gi;

  let folderMatch;
  while ((folderMatch = folderRegex.exec(html)) !== null) {
    const block = folderMatch[1];

    const titleMatch = block.match(titleRegex);
    const title = titleMatch ? titleMatch[1].trim() : "Untitled";

    const links = [];
    let linkMatch;
    while ((linkMatch = linkRegex.exec(block)) !== null) {
      links.push({
        text: linkMatch[2].trim(),
        url: linkMatch[1].trim()
      });
    }

    data.sections.push({ title, links });
  }
}

/* ---------------------------------------------------------
   Plain text parser (URLs only)
--------------------------------------------------------- */
function parsePlainText(text) {
  const lines = text.split("\n");

  const links = lines
    .filter(line => line.includes("http"))
    .map(line => ({
      text: line.trim(),
      url: line.trim()
    }));

  if (links.length === 0) {
    alert("No URLs found in plain text.");
    return;
  }

  data.sections.push({
    title: "Imported Text",
    links
  });
}

/* ---------------------------------------------------------
   CSV parser (two columns: name,url)
--------------------------------------------------------- */
function parseCSVText(text) {
  const rows = text.split("\n").map(r => r.split(","));
  const sectionName = prompt("Name for imported CSV section:", "Imported CSV");
  if (!sectionName) return;

  const newSection = { title: sectionName, links: [] };

  rows.forEach(row => {
    if (row.length >= 2) {
      newSection.links.push({ text: row[0].trim(), url: row[1].trim() });
    }
  });

  data.sections.push(newSection);
}

/* ---------------------------------------------------------
   IMPORT OPEN TABS AS NEW SECTION
--------------------------------------------------------- */
function importOpenTabsAsSection() {
  const sectionName = prompt("Name for the new 'Open Tabs' section:", "Open Tabs");
  if (!sectionName) return;

  const links = edge_all_open_tabs
    .filter(t => t.pageUrl && t.pageUrl.trim() !== "")
    .map(t => ({
      text: t.isCurrent ? t.pageTitle + " (Current Tab)" : t.pageTitle,
      url: t.pageUrl
    }));

  if (links.length === 0) {
    alert("No valid tabs with URLs to import.");
    return;
  }

  data.sections.push({ title: sectionName, links });
  save();
  render();
}

/* ---------------------------------------------------------
   MERGE OPEN TABS INTO EXISTING SECTION
--------------------------------------------------------- */
function importOpenTabsMerge() {
  if (data.sections.length === 0) {
    alert("No sections exist yet. Create a section first.");
    return;
  }

  const names = data.sections.map((s, i) => `${i}: ${s.title}`).join("\n");
  const choice = prompt("Choose section index to merge open tabs into:\n" + names);
  if (choice === null) return;

  const idx = parseInt(choice, 10);
  if (isNaN(idx) || idx < 0 || idx >= data.sections.length) {
    alert("Invalid section index.");
    return;
  }

  const links = edge_all_open_tabs
    .filter(t => t.pageUrl && t.pageUrl.trim() !== "")
    .map(t => ({
      text: t.isCurrent ? t.pageTitle + " (Current Tab)" : t.pageTitle,
      url: t.pageUrl
    }));

  if (links.length === 0) {
    alert("No valid tabs with URLs to merge.");
    return;
  }

  data.sections[idx].links = data.sections[idx].links.concat(links);
  save();
  render();
}

/* ---------------------------------------------------------
   EXPORT OPEN TABS TO CSV
--------------------------------------------------------- */
function exportOpenTabsCSV() {
  const rows = edge_all_open_tabs
    .filter(t => t.pageUrl && t.pageUrl.trim() !== "")
    .map(t => `"${t.pageTitle.replace(/"/g, '""')}","${t.pageUrl.replace(/"/g, '""')}"`);

  if (rows.length === 0) {
    alert("No tabs with URLs to export.");
    return;
  }

  const csvContent = rows.join("\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "open_tabs.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------
   EXPORT OPEN TABS TO HTML (Netscape Format)
--------------------------------------------------------- */
function exportOpenTabsHTML() {
  const links = edge_all_open_tabs
    .filter(t => t.pageUrl && t.pageUrl.trim() !== "");

  if (links.length === 0) {
    alert("No tabs with URLs to export.");
    return;
  }

  let html = `<!DOCTYPE NETSCAPE-Bookmark-file-1>
<TITLE>Open Tabs Export</TITLE>
<H1>Bookmarks</H1>
<DL><p>
<DT><H3>Open Tabs</H3>
<DL><p>
`;

  links.forEach(t => {
    html += `<DT><A HREF="${t.pageUrl}">${t.pageTitle}</A>\n`;
  });

  html += `</DL><p>
</DL><p>
`;

  const blob = new Blob([html], { type: "text/html;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "open_tabs_bookmarks.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
